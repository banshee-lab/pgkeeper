[global]
temp-path = "/tmp/pgk/tmp"
log-path  = "/tmp/pgk/logs"
db-path   = "/tmp/pgk/pgkeeper.db"
listen    = ":8080"

[restore]
restore-image = "postgres:18"

[restic]
repository = "/tmp/pgk/restic"
password   = "dev-password"
keep-daily = 7
skip-prune = true
prune-cron = "*/5 * * * *" 

[backup.main_db]
cron       = "@every 1m"
container  = "pg-test"
database   = "app"
roles      = true
