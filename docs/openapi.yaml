openapi: 3.0.3
info:
  title: pgkeeper API
  version: 1.1.0
  description: >
    Scheduler and API for PostgreSQL backups (pg_dump via docker exec → restic).
    When OIDC is configured, /api/v1 routes require the pgkeeper_session cookie.

    POST /auth/logout and POST /api/v1/backups/{name}/run require a matching
    Origin or Referer header (same-origin check).
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: backups
  - name: activities
  - name: jobs

security:
  - sessionCookie: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness/readiness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /auth/login:
    get:
      tags: [auth]
      summary: Start OIDC login (redirects to the IdP)
      security: []
      parameters:
        - name: redirect_to
          in: query
          description: Relative path to return to after login
          schema: { type: string, example: /backups }
      responses:
        '302': { description: Redirect to the identity provider }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/callback:
    get:
      tags: [auth]
      summary: OIDC callback (sets the session cookie)
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: 'Redirect to the original page; cookie set' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Destroy the session
      description: >
        Requires a same-origin Origin or Referer header. Returns 403 if the
        header is absent or cross-origin.
      responses:
        '204': { description: Logged out }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/me:
    get:
      tags: [auth]
      summary: Current user / auth status
      description: >
        When auth is disabled, returns `{"auth_enabled":false,"authenticated":true,"user":null}`.
        When auth is enabled and the session is valid, returns the user's profile.
        When auth is enabled and there is no valid session, returns 401.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/backups:
    get:
      tags: [backups]
      summary: List configured backups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Backup' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/backups/{name}:
    parameters:
      - $ref: '#/components/parameters/BackupName'
    get:
      tags: [backups]
      summary: Backup details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/backups/{name}/activities:
    parameters:
      - $ref: '#/components/parameters/BackupName'
    get:
      tags: [backups, activities]
      summary: Activities for one backup (paginated)
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/SinceFilter'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200': { $ref: '#/components/responses/PagedActivityList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/backups/{name}/run:
    parameters:
      - $ref: '#/components/parameters/BackupName'
    post:
      tags: [backups]
      summary: Fire a backup manually
      description: >
        Requires a same-origin Origin or Referer header. Returns 403 if the
        header is absent or cross-origin.
      responses:
        '202':
          description: Accepted; execution started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Backup already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Server is shutting down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/activities:
    get:
      tags: [activities]
      summary: Recent activities across all backups (paginated)
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/SinceFilter'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200': { $ref: '#/components/responses/PagedActivityList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/activities/{id}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      tags: [activities]
      summary: Activity details
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/activities/{id}/log:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      tags: [activities]
      summary: Full execution log (content so far if still running)
      description: >
        Returns the log as text/plain. If the activity is running and the log
        file has not been created yet, returns 200 with an empty body.
        Pass `download=1` to receive the file as a download with a sanitized
        Content-Disposition filename.
      parameters:
        - name: download
          in: query
          description: Set to 1 to trigger a file download
          schema: { type: integer, enum: [1] }
      responses:
        '200':
          description: Log text
          headers:
            Content-Disposition:
              description: Present only when download=1; value is `attachment; filename="…"`
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/activities/{id}/log/stream:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
      - name: Last-Event-ID
        in: header
        description: Resume after this log line number
        schema: { type: integer, minimum: 0 }
    get:
      tags: [activities]
      summary: SSE stream of the execution log
      description: >
        The stream starts with `retry: 3000` followed by replayed log lines,
        then follows live; closes after the `end` event.
        When auth is enabled and the session expires while the stream is open,
        the server closes the stream without an `end` event.
        Events: `log` (data: LogLine, id: line number) and `end` (data: LogEnd).
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: Currently running executions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/jobs/stream:
    get:
      tags: [jobs]
      summary: SSE stream of job state changes
      description: >
        The stream starts with `retry: 3000` followed by a `snapshot` event
        (current job list). Subsequent events: `job.started` (Job),
        `job.phase` (Job), `job.finished` (JobFinished).
        When auth is enabled and the session expires while the stream is open,
        the server closes the stream without further events.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pgkeeper_session

  parameters:
    BackupName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,62}$' }
    ActivityId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      description: Max items per page (1–100, default 10)
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    StatusFilter:
      name: status
      in: query
      description: Filter by activity status
      schema: { $ref: '#/components/schemas/ActivityStatus' }
    SinceFilter:
      name: since
      in: query
      description: RFC3339 lower bound on started_at (inclusive)
      schema: { type: string, format: date-time }
    CursorParam:
      name: cursor
      in: query
      description: Opaque pagination cursor from the previous page's `next` field
      schema: { type: string }

  responses:
    PagedActivityList:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: '#/components/schemas/Activity' }
              next:
                type: string
                description: >
                  Opaque cursor to pass as `cursor` for the next page.
                  Absent when there are no further pages.
    ActivityList:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                maxItems: 10
                items: { $ref: '#/components/schemas/Activity' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Missing or expired session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Request origin not allowed (same-origin check failed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthenticated, backup_not_found, activity_not_found, log_not_found, backup_running, internal_error, not_implemented, not_found, method_not_allowed, unavailable, rate_limited]
            message: { type: string }

    ActivityStatus:
      type: string
      enum: [running, success, error]

    Trigger:
      type: string
      enum: [schedule, manual]

    Phase:
      type: string
      enum: [queued, dump, roles, restic, cleanup]
      description: |
        `queued` means the run finished its dumps and waits for another backup
        that is using the same restic repository.

    Activity:
      type: object
      required: [id, backup_name, database, triggered_by, status, started_at, finished_at, duration_ms, error, log_url]
      properties:
        id: { type: string, format: uuid }
        backup_name: { type: string }
        database: { type: string }
        triggered_by: { $ref: '#/components/schemas/Trigger' }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        duration_ms: { type: integer, format: int64, nullable: true }
        error: { type: string, nullable: true }
        log_url: { type: string }

    ResticView:
      type: object
      required: [repository, tag]
      properties:
        repository: { type: string, description: Credentials embedded in the URL are redacted }
        tag: { type: string }
        keep_daily: { type: integer }
        keep_weekly: { type: integer }
        keep_monthly: { type: integer }
        keep_yearly: { type: integer }

    Snapshot:
      type: object
      required: [id, timestamp, files_added, files_changed, bytes_added]
      properties:
        id: { type: string, description: Restic snapshot id }
        timestamp: { type: string, format: date-time, description: When the snapshot was taken }
        files_added: { type: integer, format: int64, description: New files in the snapshot }
        files_changed: { type: integer, format: int64 }
        bytes_added: { type: integer, format: int64, description: Data added to the repository by the snapshot }

    Backup:
      type: object
      required: [name, cron, timezone, container, database, username, host, port, roles, restic, running, next_run, last_success_at, last_activity, latest_snapshot]
      properties:
        name: { type: string }
        cron: { type: string }
        timezone:
          type: string
          description: IANA timezone name used by the scheduler (e.g. "America/New_York" or "Local")
        container: { type: string }
        database: { type: string }
        username: { type: string }
        host: { type: string }
        port: { type: integer }
        roles: { type: boolean }
        restic: { $ref: '#/components/schemas/ResticView' }
        running: { type: boolean }
        next_run: { type: string, format: date-time, nullable: true }
        last_success_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 time of the most recent successful activity, or null if never succeeded.
        last_activity:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Activity'
        latest_snapshot:
          nullable: true
          description: Snapshot created by the latest successful restic backup, or null if none was recorded yet.
          allOf:
            - $ref: '#/components/schemas/Snapshot'

    Job:
      type: object
      required: [activity_id, backup_name, database, triggered_by, status, phase, started_at]
      properties:
        activity_id: { type: string, format: uuid }
        backup_name: { type: string }
        database: { type: string }
        triggered_by: { $ref: '#/components/schemas/Trigger' }
        status: { type: string, enum: [running] }
        phase: { $ref: '#/components/schemas/Phase' }
        started_at: { type: string, format: date-time }

    JobFinished:
      type: object
      required: [job, activity]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        activity: { $ref: '#/components/schemas/Activity' }

    LogLine:
      type: object
      required: [line]
      properties:
        line: { type: string }

    LogEnd:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [success, error] }
        error: { type: string }

    Me:
      type: object
      required: [auth_enabled, authenticated, user]
      properties:
        auth_enabled: { type: boolean }
        authenticated: { type: boolean }
        user:
          nullable: true
          type: object
          properties:
            subject: { type: string }
            email: { type: string }
            name: { type: string }