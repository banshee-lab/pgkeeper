[global]
timezone  = "America/Argentina/Buenos_Aires"
include   = ["conf/*.toml"]
temp_path = "${PGKEEPER_TEMP_PATH:-/var/tmp}"
log_path  = "${PGKEEPER_LOG_PATH:-/var/log}"
listen    = ":8080"
db_path   = "${PGKEEPER_DB_PATH:-/var/lib/pgkeeper/pgkeeper.db}"

[telegram]
bot_token = "${TG_BOT_TOKEN}"
chat_id   = "${TG_CHAT_ID}"

[auth]
issuer       = "https://idp.example.com/realms/x"
client_id    = "pgkeeper"
secret       = "${OIDC_SECRET}"
redirect_url = "https://pgkeeper.example.com/auth/callback"

[restic]
repository   = "/srv/restic"
password     = "${RESTIC_PASSWORD}"
keep-daily   = 7
keep-weekly  = 4
keep-monthly = 12
keep-yearly  = 2

[backup.main_db]
cron       = "@daily"
container  = "postgres-main"
database   = "app"
restic_tag = "main_db"
roles      = true

[backup.reports]
cron        = "30 2 * * *"
container   = "postgres-reports"
database    = "reports"
restic_keep-daily  = 14   # per-backup restic override