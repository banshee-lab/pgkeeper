[global]
timezone  = "America/Argentina/Buenos_Aires"
include   = ["conf/*.toml"]
temp-path = "${PGKEEPER_TEMP_PATH:-/var/tmp}"
log-path  = "${PGKEEPER_LOG_PATH:-/var/log}"
listen    = ":8080"
db-path   = "${PGKEEPER_DB_PATH:-/var/lib/pgkeeper/pgkeeper.db}"
# Image with the PostgreSQL client tools (pg_dump, pg_dumpall, psql). Required
# to back up or restore remote databases (database-url); a one-shot container is
# started from it for every run, so pgkeeper itself needs no PostgreSQL tools.
# Without it, database-url backups fail and the UI disables "Restore to Database URL".
tools-image = "postgres:18"

[telegram]
bot-token = "${TG_BOT_TOKEN}"
chat-id   = "${TG_CHAT_ID}"

[auth]
issuer       = "https://idp.example.com/realms/x"
client-id    = "pgkeeper"
secret       = "${OIDC_SECRET}"
redirect-url = "https://pgkeeper.example.com/auth/callback"

[restic]
repository   = "/srv/restic"
password     = "${RESTIC_PASSWORD}"
keep-daily   = 7
keep-weekly  = 4
keep-monthly = 12
keep-yearly  = 2
# Optional global maintenance over every distinct repository (global + backup
# overrides). Leave the crons unset to disable.
prune-cron         = "0 4 * * 0"   # weekly restic prune
check-cron         = "0 3 * * 6"   # weekly restic check
check-read-percent = 80            # % of data read back (default 80)
# skip-prune = true                # forget after each backup without pruning;
                                   # then only prune-cron reclaims space

# Test restores: a throw-away PostgreSQL container is started from this image,
# the latest snapshot is restored into it and the container is removed again.
[restore]
restore-image = "postgres:18"   # default image for restore containers

[backup.main_db]
cron       = "@daily"
container  = "postgres-main"
database   = "app"
restic-tag = "main_db"
roles      = true
restore-cron  = "0 5 * * *"     # scheduled test restore (optional)
restore-image = "postgres:17"   # optional override; falls back to [restore].restore-image

# A remote PostgreSQL server instead of a container. database-url replaces
# container/host/port/username (and database, when the URL names one).
[backup.remote_orders]
cron         = "0 1 * * *"
database-url = "postgresql://backup:${ORDERS_DB_PASSWORD}@db.example.com:5432/orders?sslmode=require"
restic-tag   = "remote_orders"
# roles = true   # pg_dumpall --roles-only usually needs superuser rights; managed services often deny it

[backup.reports]
cron        = "30 2 * * *"
container   = "postgres-reports"
database    = "reports"
restic-keep-daily  = 14   # per-backup restic override